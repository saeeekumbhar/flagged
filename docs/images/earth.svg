<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8BBE" />
      <stop offset="100%" stop-color="#306998" />
    </linearGradient>
    <linearGradient id="land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#889063" />
      <stop offset="100%" stop-color="#354024" />
    </linearGradient>
  </defs>
  
  <circle cx="50" cy="50" r="48" fill="url(#ocean)" />
  
  <g clip-path="url(#circle-clip)">
    <g fill="url(#land)">
      <path d="M 20 20 Q 40 10 50 30 T 30 50 Q 10 40 20 20 Z" />
      <path d="M 60 10 Q 90 20 80 50 T 50 70 Q 40 40 60 10 Z" />
      <path d="M 30 70 Q 50 60 60 90 T 20 80 Q 20 60 30 70 Z" />
      
      <!-- Animation: Move continents right to simulate spinning -->
      <animateTransform attributeName="transform" type="translate" from="-100 0" to="100 0" dur="4s" repeatCount="indefinite" />
    </g>
    <g fill="url(#land)">
      <path d="M 20 20 Q 40 10 50 30 T 30 50 Q 10 40 20 20 Z" />
      <path d="M 60 10 Q 90 20 80 50 T 50 70 Q 40 40 60 10 Z" />
      <path d="M 30 70 Q 50 60 60 90 T 20 80 Q 20 60 30 70 Z" />
      
      <!-- Second set to loop seamlessly -->
      <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="4s" repeatCount="indefinite" />
    </g>
  </g>
  
  <!-- Add shadow for 3D effect -->
  <circle cx="50" cy="50" r="48" fill="transparent" stroke="rgba(0,0,0,0.2)" stroke-width="4" />
  <path d="M 50 2 A 48 48 0 0 1 50 98 A 20 48 0 0 0 50 2 Z" fill="rgba(0,0,0,0.15)" />
</svg>
